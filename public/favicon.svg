<!-- Shield-badge favicon derived from logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a35d4"/>
      <stop offset="100%" stop-color="#0d1e80"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c8d4e0"/>
      <stop offset="100%" stop-color="#8a9ab0"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M32 3 L58 14 L58 36 Q58 54 32 62 Q6 54 6 36 L6 14 Z" fill="url(#bg)" stroke="#252b36" stroke-width="1.5"/>
  <!-- Chrome L lettermark -->
  <text x="32" y="46" font-family="Bebas Neue,Impact,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="url(#chrome)">L</text>
</svg>
